[project]
name = "course-policy-pipeline"
version = "0.1.0"
description = "Evidence-first pipeline for course repetition policy collection and classification."
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pypdf>=5.0",
  "tomli>=2.0; python_version<'3.11'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
